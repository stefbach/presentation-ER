<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 372 96">
  <!-- Stylised recreation of the EDB Mauritius block-"B" mark -->
  <g>
    <!-- row 1 : navy square + top lobe of the B -->
    <rect x="30" y="0" width="24" height="27" fill="#1B4E80"/>
    <path d="M60 0 h14 a13.5 13.5 0 0 1 0 27 h-14 z" fill="#1B4E80"/>
    <!-- row 2 : navy square · cyan square · middle-right lobe -->
    <rect x="0" y="31" width="24" height="27" fill="#1B4E80"/>
    <rect x="30" y="31" width="24" height="27" fill="#2098D5"/>
    <path d="M60 31 h17 a13.5 13.5 0 0 1 0 27 h-17 z" fill="#2098D5"/>
    <!-- row 3 : green square + bottom lobe of the B -->
    <rect x="0" y="62" width="24" height="27" fill="#79BE43"/>
    <path d="M30 62 h44 a13.5 13.5 0 0 1 0 27 h-44 z" fill="#1B4E80"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1B4E80">
    <text x="106" y="26" font-size="24" font-weight="bold" letter-spacing="0.5">ECONOMIC</text>
    <text x="106" y="56" font-size="24" font-weight="bold" letter-spacing="0.5">DEVELOPMENT</text>
    <text x="106" y="86" font-size="24" font-weight="bold" letter-spacing="0.5">BOARD <tspan font-size="17" font-weight="normal" fill="#2098D5">MAURITIUS</tspan></text>
  </g>
</svg>
